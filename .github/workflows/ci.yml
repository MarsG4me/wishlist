name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # unit tests + FullFlowIT (Testcontainers spins up postgres:18)
      - name: mvn verify -Pit
        working-directory: backend
        run: mvn -B verify -Pit

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck + build
        working-directory: frontend
        run: npm run build

  e2e:
    name: Browser end-to-end (Playwright/Python)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt

      - name: Start Postgres + Keycloak
        run: docker compose up -d

      - name: Wait for Keycloak realm
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8180/realms/wishlist-dev/.well-known/openid-configuration > /dev/null && exit 0
            sleep 5
          done
          echo "Keycloak did not come up" >&2; exit 1

      - name: Start backend
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: dev
        run: |
          nohup mvn -B spring-boot:run > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:6543/health > /dev/null && exit 0
            sleep 5
          done
          echo "Backend did not come up" >&2; tail -50 /tmp/backend.log; exit 1

      - name: Start frontend
        working-directory: frontend
        run: |
          npm ci
          nohup npx vite --port 5173 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173/ > /dev/null && exit 0
            sleep 2
          done
          echo "Frontend did not come up" >&2; exit 1

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: tests/e2e
        run: pytest -v --browser chromium

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            /tmp/backend.log
            /tmp/vite.log
