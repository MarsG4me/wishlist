; Two processes, one container: the Spring Boot backend and the nginx that fronts it.
; If either dies for good the container must die too, so the orchestrator restarts a
; clean one instead of serving half an app — that is what the exit-listener does.
[supervisord]
nodaemon=true
; nodaemon already echoes everything to stdout; a stdout logfile on top prints it twice
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[eventlistener:quit_on_failure]
command=sh -c 'printf "READY\n"; while read -r line; do echo "supervisord: $line, stopping container" >&2; kill -TERM "$PPID"; done'
events=PROCESS_STATE_FATAL

[program:backend]
command=java %(ENV_JAVA_OPTS)s -jar /opt/wishlist/app.jar
directory=/opt/wishlist
autorestart=true
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -c /etc/nginx/nginx.conf -g "daemon off;"
autorestart=true
startretries=3
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
