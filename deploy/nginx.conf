# In-container nginx: serves the built SPA and proxies the API to the backend that runs
# in the same container on 127.0.0.1:6543. TLS, HTTP/2, the public hostname and the
# Keycloak rate limiting all live in the OUTER nginx in front of this container.
#
# Runs unprivileged, so every writable path points at /tmp.
worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    log_format main '$remote_addr - $status $request_method $uri '
                    '$body_bytes_sent ${request_time}s "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;
    client_max_body_size 1m;

    # Generated by the entrypoint from TRUSTED_PROXY_CIDR: without it every request would
    # be keyed on the outer proxy's address, so one client could exhaust the rate limits
    # for everybody — and the /health allowlist below would let the whole internet through.
    include /tmp/nginx/real_ip.conf;

    # Two zones. `api` is a sanity ceiling for normal browsing; `sensitive` covers the
    # endpoints that hit Keycloak or hand out access to other people's data, where a
    # slow brute force is the actual threat. Keycloak's own endpoints are limited outside.
    limit_req_zone $binary_remote_addr zone=api:10m       rate=20r/s;
    limit_req_zone $binary_remote_addr zone=sensitive:1m  rate=12r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    limit_conn_status 429;

    # keep the scheme the outer proxy saw; fall back to ours when it sends nothing
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    upstream backend {
        server 127.0.0.1:6543;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;
        limit_conn conn 64;

        # Security headers are added per static location only: Spring Security already
        # sends its own on every proxied response, and add_header would duplicate them.

        # --- API -----------------------------------------------------------------
        # Password change and email change go through Keycloak (verify + admin API), and
        # joining consumes an invite code — all three are guessable-secret endpoints.
        location = /v1/users/me/password {
            limit_req zone=sensitive burst=3 nodelay;
            include /etc/nginx/proxy_params.conf;
            proxy_pass http://backend;
        }

        location = /v1/users/me/email {
            limit_req zone=sensitive burst=3 nodelay;
            include /etc/nginx/proxy_params.conf;
            proxy_pass http://backend;
        }

        location = /v1/memberships/join {
            limit_req zone=sensitive burst=3 nodelay;
            include /etc/nginx/proxy_params.conf;
            proxy_pass http://backend;
        }

        location /v1/invites/ {
            limit_req zone=sensitive burst=3 nodelay;
            include /etc/nginx/proxy_params.conf;
            proxy_pass http://backend;
        }

        location /v1/links/ {
            limit_req zone=sensitive burst=3 nodelay;
            include /etc/nginx/proxy_params.conf;
            proxy_pass http://backend;
        }

        location /v1/ {
            limit_req zone=api burst=40 nodelay;
            include /etc/nginx/proxy_params.conf;
            proxy_pass http://backend;
        }

        # --- health --------------------------------------------------------------
        # Container/orchestrator probes only. The outer nginx must not proxy /health;
        # this allowlist is the second lock, and it only bites once TRUSTED_PROXY_CIDR
        # is set (otherwise the outer proxy's own private address is what is checked).
        location = /health {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            access_log off;
            include /etc/nginx/proxy_params.conf;
            proxy_pass http://backend;
        }

        # --- static SPA ----------------------------------------------------------
        root /srv/www;
        index index.html;

        # rewritten on every container start, so it must never be cached
        location = /config.js {
            alias /tmp/nginx/config.js;
            include /etc/nginx/security_headers.conf;
            add_header Cache-Control "no-store" always;
        }

        location = /index.html {
            include /etc/nginx/security_headers.conf;
            add_header Cache-Control "no-store" always;
        }

        # vite emits content-hashed filenames here
        location /assets/ {
            include /etc/nginx/security_headers.conf;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            access_log off;
        }

        # Everything else is the SPA. /docs/** is deliberately NOT proxied: springdoc is
        # off in the prod profile anyway, and unmatched paths landing on index.html keeps
        # the API surface unpublished even if the profile is ever forgotten.
        location / {
            include /etc/nginx/security_headers.conf;
            try_files $uri $uri/ /index.html;
        }
    }
}
