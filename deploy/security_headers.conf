# Headers for the statically served SPA. The outer proxy owns HSTS and CSP; proxied API
# responses get theirs from Spring Security, so this is never included in those locations.
# nginx `add_header` does not merge across levels — a location that sets any header of its
# own loses the ones above it — hence the include in every static location.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
