# Static SPA headers; CSP comes from the entrypoint-rendered csp.conf. Never included in proxied
# API locations (Spring Security sets theirs). add_header does not merge across levels, so
# every static location includes this file.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
include /tmp/nginx/csp.conf;
