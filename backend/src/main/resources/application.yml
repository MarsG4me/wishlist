server:
  port: ${SERVER_PORT:6543}

spring:
  application:
    name: wishlist-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/wishlist}
    username: ${DB_USER:wishlist}
    password: ${DB_PASSWORD:wishlist}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/wishlist-dev}
          # Issuer alone is not enough: every client of the realm mints tokens with the
          # same issuer, so without an audience check a token meant for any other client
          # (incl. the public direct-grant one) would authenticate here. The clients that
          # may talk to this API carry the audience via an oidc-audience-mapper.
          audiences: ${KEYCLOAK_AUDIENCE:wishlist-api}

springdoc:
  api-docs:
    path: /docs/api-docs
  swagger-ui:
    path: /docs/api-ui.html

management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        health: health
      exposure:
        include: health

wishlist:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  purge:
    enabled: ${PURGE_ENABLED:true}
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:wishlist-dev}
    # confidential client with service-account role realm-management/manage-users (password resets)
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:wishlist-backend}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:dev-secret}
    # public client with direct access grants (current-password verification)
    verify-client-id: ${KEYCLOAK_VERIFY_CLIENT_ID:wishlist-cli}
  link-safety:
    allowed-domains: ${LINK_ALLOWED_DOMAINS:amazon.de,amazon.com,amazon.co.uk,amazon.fr,amazon.it,amazon.es,amzn.to,amzn.eu,ebay.de,ebay.com,etsy.com,otto.de,zalando.de,ikea.com,mediamarkt.de,saturn.de,thalia.de,idealo.de,galaxus.de,kaufland.de,lidl.de,tchibo.de,decathlon.de,hm.com,apple.com,steampowered.com,nintendo.com,playstation.com,lego.com,douglas.de,bol.com,conrad.de,alternate.de,notebooksbilliger.de,cyberport.de}
    # empty key = no Web Risk lookup
    web-risk-api-key: ${WEB_RISK_API_KEY:}
    blocklist:
      enabled: ${LINK_BLOCKLIST_ENABLED:true}
      urls: ${LINK_BLOCKLIST_URLS:https://malware-filter.gitlab.io/malware-filter/urlhaus-filter-hosts-online.txt,https://blocklistproject.github.io/Lists/alt-version/phishing-nl.txt,https://blocklistproject.github.io/Lists/alt-version/malware-nl.txt,https://blocklistproject.github.io/Lists/alt-version/scam-nl.txt,https://blocklistproject.github.io/Lists/alt-version/fraud-nl.txt,https://blocklistproject.github.io/Lists/alt-version/porn-nl.txt,https://blocklistproject.github.io/Lists/alt-version/abuse-nl.txt}
