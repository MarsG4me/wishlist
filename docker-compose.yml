# Dev infra. Host networking is used because bridge-forwarding is blocked by
# local firewalls on some dev machines; PG binds 5433 (system Postgres owns 5432).
services:
  postgres:
    image: postgres:18
    network_mode: host
    environment:
      POSTGRES_DB: wishlist
      POSTGRES_USER: wishlist
      POSTGRES_PASSWORD: wishlist
      PGPORT: "5433"
    volumes:
      # postgres:18 images store data under /var/lib/postgresql (versioned subdirs)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishlist -d wishlist -p 5433"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    network_mode: host
    command: start-dev --import-realm --http-port=8180
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import

volumes:
  pgdata:
